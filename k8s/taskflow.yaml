
apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: taskflow
  template:
    metadata:
      labels:
        app: taskflow
    spec:
      containers:
        - name: taskflow
          image: 928535088701.dkr.ecr.eu-north-1.amazonaws.com/taskflow:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80

          livenessProbe:
            httpGet:
              path: /up
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 10

          readinessProbe:
            httpGet:
              path: /up
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 5

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          env:
            - name: APP_ENV
              value: production
            - name: APP_DEBUG
              value: "false"
            - name: APP_KEY
              valueFrom:
                secretKeyRef:
                  name: taskflow-app-secret
                  key: APP_KEY

            - name: DB_CONNECTION
              value: mysql

            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: taskflow-db-secret
                  key: DB_HOST

            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: taskflow-db-secret
                  key: DB_PORT

            - name: DB_DATABASE
              valueFrom:
                secretKeyRef:
                  name: taskflow-db-secret
                  key: DB_DATABASE

            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: taskflow-db-secret
                  key: DB_USERNAME

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: taskflow-db-secret
                  key: DB_PASSWORD

            - name: SESSION_DRIVER
              value: file
---
apiVersion: v1
kind: Service
metadata:
  name: taskflow
spec:
  selector:
    app: taskflow
  ports:
    - port: 80
      targetPort: 80
  type: LoadBalancer
